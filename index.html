<!doctype html>

<head>
<meta charset="utf-8">

<title>webxp &mdash; a Windows XP window manager</title>
<meta name="description" content="Windows XP window chrome with the behaviour: windows that move, resize from eight edges, minimise into the taskbar and maximise, with Luna's controls and its open animation.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/src/theme.css">
<link rel="stylesheet" href="/src/shell.css">

<body>

<!-- The shell is built by JavaScript, not written here. Windows are created, moved, resized
     and destroyed at runtime, so a desktop spelled out as markup would be a picture of one
     and the two copies would drift. `src/desktop.mjs` is the only place the shell's shape
     exists. -->
<div id="webxp">
  <noscript>
    <div class="noscript">
      <h1>webxp needs JavaScript</h1>
      <p>The desktop, the taskbar and every window are built at runtime. There is no static
        version to fall back to.</p>
      <!-- No file count. It said "five modules" against six, because a number in prose goes
           stale the first time a module is added and nothing checks it. -->
      <p>The source is under <code>src/</code>.</p>
    </div>
  </noscript>
</div>

<script type="module" src="/demo/boot.mjs"></script>
</body>
</html>
